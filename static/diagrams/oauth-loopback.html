<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地回环解析 Code · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-soft: #7a8399;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #eb6c36;
      --color-link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--color-muted);
      max-width: 58ch;
      margin-bottom: 1.5rem;
    }
    .diagram-container {
      background: var(--color-paper-2);
      border: 1px solid var(--color-rule);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }
    svg { width: 100%; min-width: 820px; height: auto; display: block; background: #f5f5f5; border-radius: 6px; }
    body.is-embed { padding: 0.25rem; min-height: 0; align-items: stretch; }
    body.is-embed .frame { max-width: none; }
    body.is-embed .eyebrow,
    body.is-embed h1,
    body.is-embed .subtitle { display: none; }
    body.is-embed .diagram-container {
      border: 0;
      background: transparent;
      border-radius: 0;
      padding: 0;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <script>document.addEventListener('DOMContentLoaded',function(){if(window.self!==window.top)document.body.classList.add('is-embed');});</script>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>本地回环微型服务器（解析 code）</h1>
    <p class="subtitle">Cursor 在本机随机端口监听；云端把浏览器 302 回 <code>localhost</code>，桌面端直接从 URL 取出 code。</p>
    <div class="diagram-container">
      <svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oauth-loop-title oauth-loop-desc">
        <title id="oauth-loop-title">本地回环微型服务器解析 code</title>
        <desc id="oauth-loop-desc">Cursor 桌面端、系统浏览器与云端认证服务器之间的 localhost 回环回调时序图。</desc>
        <defs>
          <pattern id="dots2" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots2)" opacity="0.45"/>

        <!-- Lifelines: Cursor 160, Browser 450, Server 740 -->
        <line x1="160" y1="132" x2="160" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="450" y1="132" x2="450" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="740" y1="132" x2="740" y2="480" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <rect x="156" y="180" width="8" height="280" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="446" y="228" width="8" height="200" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="736" y="276" width="8" height="80" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- OPT frame for loopback breakthrough -->
        <rect x="132" y="340" width="344" height="120" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="132" y="340" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="152" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
        <text x="184" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[browser → localhost]</text>

        <!-- 1 self: listen -->
        <path d="M 168 176 L 208 176 L 208 208 L 168 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="216" y="184" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="292" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">1 · LISTEN :12345</text>

        <!-- 2 Cursor -> Browser -->
        <line x1="160" y1="248" x2="450" y2="248" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="232" y="232" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="242" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">2 · OPEN AUTH + REDIRECT_URI</text>

        <!-- 3 Browser -> Server -->
        <line x1="450" y1="296" x2="740" y2="296" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="520" y="280" width="152" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="290" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">3 · LOGIN SUCCESS</text>

        <!-- 4 Server -> Browser return -->
        <line x1="740" y1="344" x2="450" y2="344" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="508" y="328" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="338" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">4 · 302 LOCALHOST?CODE=</text>

        <!-- 5 Browser -> Cursor accent -->
        <line x1="450" y1="392" x2="160" y2="392" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="232" y="376" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="386" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">5 · GET /CALLBACK?CODE=</text>

        <!-- 6 self extract -->
        <path d="M 168 424 L 208 424 L 208 448 L 168 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="216" y="428" width="120" height="12" rx="2" fill="#f5f5f5"/>
        <text x="276" y="438" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">6 · EXTRACT CODE</text>

        <!-- 7 Cursor -> Browser return -->
        <line x1="160" y1="480" x2="450" y2="480" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="232" y="464" width="176" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="474" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">7 · 200 SUCCESS PAGE</text>

        <!-- Actors -->
        <rect x="80" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="72" width="160" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="88" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="108" y="89" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="160" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cursor 桌面端</text>
        <text x="160" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">localhost listener</text>

        <rect x="378" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="378" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="386" y="80" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="406" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
        <text x="450" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">系统浏览器</text>
        <text x="450" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Chrome</text>

        <rect x="668" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="668" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="676" y="80" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="698" y="89" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLOUD</text>
        <text x="740" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">认证服务器</text>
        <text x="740" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Authorize / redirect</text>

        <text x="48" y="528" fill="#2d3142" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">关键一击：浏览器请求本机端口，桌面端截获 code。</text>
      </svg>
    </div>
  </div>
</body>
</html>
